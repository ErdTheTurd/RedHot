# GitHub Pages for this repo is configured as "Deploy from a branch".
# The previous Actions-based deploy failed on main because the
# github-pages environment only allowed an old feature branch.
#
# Keep Pages source as: Settings → Pages → Deploy from a branch → main / (root)
# GitHub's built-in pages-build-deployment will publish automatically.
#
# This workflow is a no-op health check so pushes to main don't go red.
name: Pages config check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Pages deploy mode
        run: |
          echo "Use Settings → Pages → Deploy from a branch → main / (root)."
          echo "Do not use Actions deploy unless the github-pages environment allows main."
