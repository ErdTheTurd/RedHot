# GitHub Pages for this repo is set to "Deploy from a branch" (main /).
# The built-in "pages build and deployment" already publishes on every push.
#
# A second Actions deploy-pages job races that pipeline and shows scary
# cancelled/failed runs ("higher priority waiting request for pages exists").
# This workflow only verifies the site tree and documents the branch deploy.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-status
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Pages entrypoints
        run: |
          test -f index.html
          test -f js/main.js
          test -f css/main.css
          echo "OK — GitHub Pages publishes from branch main (Settings → Pages → Deploy from a branch)."
          echo "Skip actions/deploy-pages to avoid racing the built-in Pages builder."
